<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YunFlix</title>
    <style>
        /* 全域設定 */
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* 防止動畫過程中出現捲軸 */
        }

        /* =========================================
           1. 開場動畫區塊 
           ========================================= */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; 
        }

        /* 這是包裝 Logo 圖片與文字的容器，負責一起放大 */
        /* 這是包裝 Logo 圖片與文字的容器，負責一起放大 */
        .intro-container {
            display: flex;
            align-items: center;
            gap: 15px; 
            /* 總長改為 3 秒 */
            animation: holdAndZoom 3s cubic-bezier(0.5, 0, 0.1, 1) forwards; 
        }

        

        /* 圖片大小設定 */
        .intro-container img {
            width: 75px; 
            height: 75px;
            object-fit: contain;
        }

        /* 文字大小設定 */
        .intro-text {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: white; /* 或者改成經典紅 #E50914 */
        }

        /* 動畫時間軸分配：總時長 3 秒 */
        @keyframes holdAndZoom {
            0%   { transform: scale(0.8); opacity: 0; }  /* 0秒：一開始縮小透明 */
            33%  { transform: scale(1); opacity: 1; }    /* 第 1 秒：漸進浮現完成 */
            66%  { transform: scale(1); opacity: 1; }    /* 第 2 秒：靜止停留結束 */
            73%  { transform: scale(0.95); opacity: 1; } /* 稍微蓄力向後縮 */
            100% { transform: scale(30); opacity: 0; }   /* 第 3 秒：瞬間暴衝放大並消失 */
        }

        /* =========================================
           2. 按鈕選擇區塊 (動畫結束後才出現)
           ========================================= */
        /* =========================================
           2. 按鈕選擇區塊 (動畫結束後才出現)
           ========================================= */
        #selection-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            
            opacity: 0; 
            /* 延遲時間改為 2.8 秒 */
            animation: fadeIn 1s ease-out 2.8s forwards; 
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        /* 選單上方的靜態 Logo 樣式 */
        .selection-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .selection-logo img { width: 75px; height: 75px; object-fit: contain; }
        .selection-logo span { font-size: 3rem; font-weight: bold; }

        .subtitle { margin-bottom: 30px; color: #aaa; font-size: 1.1rem; }
        .button-group { display: flex; flex-direction: column; gap: 20px; }
        .btn {
            display: inline-block;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background-color: #333;
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid #555;
            text-align: center;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: white;
            color: black;
            border-color: white;
        }
    </style>
</head>
<body>

    <!-- 開場動畫 -->
    <div id="intro-screen">
        <div class="intro-container">
            <!-- 替換這裡的 src 路徑，放上你的 Logo 圖片 -->
            <img src="NYUST.png" alt="Logo">
            <span class="intro-text">YunFlix</span>
        </div>
    </div>

    <!-- 選擇頁面 -->
    <div id="selection-screen">
        <div class="selection-logo">
            <!-- 選單上的靜態 Logo，一樣把 src 替換掉 -->
            <img src="NYUST.png" alt="Logo">
            <span>YunFlix</span>
        </div>
        <p class="subtitle">在這裡，你能看到歷屆同學用心製作出的作品。</p>
        
        <div class="button-group">
            <a href="desktop.html" class="btn">電腦版</a>
            <a href="mobile.html" class="btn">手機版</a>
        </div>
    </div>

    <script>
        // 設定 2.6 秒後，將動畫圖層完全隱藏，確保下方的按鈕可以被點擊
        setTimeout(function() {
            document.getElementById('intro-screen').style.display = 'none';
        }, 2600);
    </script>

</body>
</html>
